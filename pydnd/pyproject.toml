[project]
name = "dnd"
version = "0.1.0"
description = ""
authors = [{ name = "Ian Kirkpatrick" }]
readme = "README.md"
# `<4.0` is required: loguru declares `<4`, and Poetry won't lock a wider range
requires-python = ">=3.15,<4.0"
# Minimum versions only: poetry.lock pins exact versions, and `poetry update <pkg>`
# is free to move to new major versions.
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "alembic>=1.20.0",
    "sqlalchemy>=2.1.5",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "loguru>=0.7.3",
    # psycopg 3: SQLAlchemy 2.1's default driver for `postgresql://` URLs
    "psycopg[binary]>=3.3.6",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.16.0",
]

[project.urls]
Author = "https://github.com/humoroushorse"

[tool.poetry]
packages = [{ include = "dnd", from = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1"
pylint = ">=4.1.3"
coverage = ">=7.16.2"
pytest-cov = ">=7.1.0"
mkdocs = ">=1.6.1"
mkdocstrings = { extras = ["python"], version = ">=1.0.7" }
mkdocs-material = ">=9.7.7"
httpx = ">=0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
