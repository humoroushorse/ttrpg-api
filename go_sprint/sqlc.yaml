version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/workitems/queries"
    schema: "migrations"
    gen:
      go:
        package: "workitems"
        out: "internal/repository/workitems"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
  - engine: "postgresql"
    queries: "internal/repository/sprints/queries"
    schema: "migrations"
    gen:
