apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprint-service
  namespace: sprint-management
  labels:
    app: sprint-service
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sprint-service
  template:
    metadata:
      labels:
        app: sprint-service
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: sprint-service
        image: ghcr.io/humoroushorse/go_sprint:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: DATABASE_MASTER_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: DATABASE_MASTER_URL
        - name: DATABASE_REPLICA_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: DATABASE_REPLICA_URL
        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: sprint-config
              key: NATS_URL
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8080"
        - name: KEYCLOAK_URL
          valueFrom:
            configMapKeyRef:
              name: sprint-config
              key: KEYCLOAK_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: sprint-config
              key: KEYCLOAK_REALM
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: sprint-config
              key: LOG_LEVEL
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: sprint-config
              key: LOG_FORMAT
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: sprint-config
              key: SERVER_PORT
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: sprint-config
              key: CORS_ALLOWED_ORIGINS
        - name: RATE_LIMIT_ENABLED
          valueFrom:
            configMapKeyRef:
              name: sprint-config
              key: RATE_LIMIT_ENABLED
        - name: CACHE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: sprint-config
              key: CACHE_ENABLED
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: sprint-service
  namespace: sprint-management
  labels:
    app: sprint-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: sprint-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sprint-service-hpa
  namespace: sprint-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sprint-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
