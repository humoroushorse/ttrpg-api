# NOTE: This is a template. In production, use sealed-secrets, external-secrets, or vault
# Never commit actual secrets to version control

apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: sprint-management
type: Opaque
stringData:
  # PostgreSQL credentials (base64 encode in production)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Database URLs
  DATABASE_MASTER_URL: "postgresql://postgres:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/sprint_management?sslmode=require"
  DATABASE_REPLICA_URL: "postgresql://postgres:CHANGE_ME_IN_PRODUCTION@postgres-replica-service:5432/sprint_management?sslmode=require"
  AUTH_DATABASE_URL: "postgresql://postgres:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/auth?sslmode=require"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: sprint-management
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  KEYCLOAK_CLIENT_ID: "sprint-client"
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  namespace: sprint-management
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_LONG_RANDOM_STRING"
