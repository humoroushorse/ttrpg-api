components:
  schemas:
    WorkItemType:
      type: string
      enum:
      - epic
      - story
      - defect
      description: Type of work item
    WorkItemStatus:
      type: string
      enum:
      - todo
      - in_progress
      - in_review
      - done
      - blocked
      description: Current status of work item
    PriorityLevel:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
      description: Priority level of work item
    DependencyType:
      type: string
      enum:
      - blocks
      - is_blocked_by
      - relates_to
      - duplicates
      description: Type of dependency relationship
    WorkItem:
      type: object
      required:
      - id
      - type
      - title
      - status
      - priority
      - reporter_id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        type:
          $ref: '#/components/schemas/WorkItemType'
        title:
          type: string
          maxLength: 255
          description: Work item title
        description:
          type: string
          description: Detailed description
        status:
          $ref: '#/components/schemas/WorkItemStatus'
        priority:
          $ref: '#/components/schemas/PriorityLevel'
        story_points:
          type: integer
          minimum: 0
          nullable: true
          description: Story point estimation
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: Assigned user ID
        reporter_id:
          type: string
          format: uuid
          description: Reporter user ID
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent work item ID (for sub-tasks)
        sprint_id:
          type: string
          format: uuid
          nullable: true
          description: Associated sprint ID
        created_at:
          type: string
          format: date-time
          description: Creation timestamp (UTC)
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp (UTC)
    WorkItemDetail:
      allOf:
      - $ref: '#/components/schemas/WorkItem'
      - type: object
        properties:
          dependencies:
            type: array
            items:
              $ref: '#/components/schemas/Dependency'
            description: All dependencies for this work item
          children:
            type: array
            items:
              $ref: '#/components/schemas/WorkItem'
            description: Child work items (sub-tasks)
          comments_count:
            type: integer
            description: Number of comments
          activity_count:
            type: integer
            description: Number of activity log entries
    CreateWorkItemRequest:
      type: object
      required:
      - type
      - title
      - description
      - priority
      - project_id
      properties:
        type:
          $ref: '#/components/schemas/WorkItemType'
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Work item title
        description:
          type: string
          minLength: 1
          description: Detailed description
        priority:
          $ref: '#/components/schemas/PriorityLevel'
        story_points:
          type: integer
          minimum: 0
          nullable: true
          description: Story point estimation
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: Assigned user ID
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: 'Parent work item ID. Required for Story and Defect types (must
            be an Epic).

            Must be null for Epic type.

            '
        sprint_id:
          type: string
          format: uuid
          nullable: true
          description: Sprint to assign work item to
        project_id:
          type: string
          format: uuid
          description: Project ID (required)
    UpdateWorkItemRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Work item title
        description:
          type: string
          minLength: 1
          description: Detailed description
        status:
          $ref: '#/components/schemas/WorkItemStatus'
        priority:
          $ref: '#/components/schemas/PriorityLevel'
        story_points:
          type: integer
          minimum: 0
          nullable: true
          description: Story point estimation
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: Assigned user ID
        sprint_id:
          type: string
          format: uuid
          nullable: true
          description: Sprint to assign work item to
    Dependency:
      type: object
      required:
      - id
      - source_id
      - target_id
      - dependency_type
      - created_at
      - created_by
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        source_id:
          type: string
          format: uuid
          description: Source work item ID
        target_id:
          type: string
          format: uuid
          description: Target work item ID
        dependency_type:
          $ref: '#/components/schemas/DependencyType'
        created_at:
          type: string
          format: date-time
          description: Creation timestamp (UTC)
        created_by:
          type: string
          format: uuid
          description: User who created the dependency
    CreateDependencyRequest:
      type: object
      required:
      - target_id
      - dependency_type
      properties:
        target_id:
          type: string
          format: uuid
          description: Target work item ID
        dependency_type:
          $ref: '#/components/schemas/DependencyType'
    DependencyListResponse:
      type: object
      required:
      - dependencies
      properties:
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
    WorkItemListResponse:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItemSummary'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    PaginationInfo:
