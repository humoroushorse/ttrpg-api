          type: string
          nullable: true
          description: Cursor for next page
        has_more:
          type: boolean
          description: Whether more items are available
        total_count:
          type: integer
          nullable: true
          description: Total count (may be null for performance)
    SearchRequest:
      type: object
      properties:
        query:
          type: string
          description: Search query with boolean operators
        filters:
          type: object
          properties:
            types:
              type: array
              items:
                $ref: '#/components/schemas/WorkItemType'
            statuses:
              type: array
              items:
                $ref: '#/components/schemas/WorkItemStatus'
            priorities:
              type: array
              items:
                $ref: '#/components/schemas/PriorityLevel'
            assignee_ids:
              type: array
              items:
                type: string
                format: uuid
            sprint_ids:
              type: array
              items:
                type: string
                format: uuid
            created_after:
              type: string
              format: date-time
            created_before:
              type: string
              format: date-time
        sort:
          type: object
          properties:
            field:
              type: string
              enum:
              - created_at
              - updated_at
              - priority
              - title
            order:
              type: string
              enum:
              - asc
              - desc
        cursor:
          type: string
          description: Cursor for pagination
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    ErrorResponse:
      type: object
      required:
      - error
      - trace_id
      - timestamp
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        trace_id:
          type: string
          format: uuid
          description: Trace ID for debugging
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details
        validation_errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          description: Field name
        code:
          type: string
          description: Validation error code
        message:
          type: string
          description: Validation error message
    SprintStatus:
      type: string
      enum:
      - planned
      - active
      - completed
      - cancelled
      description: Current status of sprint
    Sprint:
      type: object
      required:
      - id
      - name
      - status
      - start_date
      - end_date
      - created_by
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          maxLength: 255
          description: Sprint name
        description:
          type: string
          description: Sprint description
        status:
          $ref: '#/components/schemas/SprintStatus'
        start_date:
          type: string
          format: date
          description: Sprint start date
        end_date:
          type: string
          format: date
          description: Sprint end date
        capacity_points:
          type: integer
          minimum: 0
          nullable: true
          description: Sprint capacity in story points
        committed_points:
          type: integer
          minimum: 0
          default: 0
          description: Committed story points
        completed_points:
          type: integer
          minimum: 0
          default: 0
          description: Completed story points
        created_by:
          type: string
          format: uuid
          description: User who created the sprint
        created_at:
          type: string
          format: date-time
          description: Creation timestamp (UTC)
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp (UTC)
    SprintDetail:
      allOf:
      - $ref: '#/components/schemas/Sprint'
      - type: object
        properties:
          work_items:
            type: array
            items:
              $ref: '#/components/schemas/WorkItemSummary'
            description: Work items in this sprint
          metrics:
            $ref: '#/components/schemas/SprintMetrics'
            description: Sprint metrics
    CreateSprintRequest:
      type: object
      required:
      - name
      - start_date
      - end_date
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Sprint name
        description:
          type: string
          description: Sprint description
        start_date:
          type: string
          format: date
          description: Sprint start date
        end_date:
          type: string
          format: date
          description: Sprint end date (must be after start_date)
        capacity_points:
          type: integer
          minimum: 0
          nullable: true
          description: Sprint capacity in story points
    UpdateSprintRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Sprint name
        description:
          type: string
          description: Sprint description
        start_date:
          type: string
          format: date
          description: Sprint start date
        end_date:
          type: string
          format: date
          description: Sprint end date (must be after start_date)
        capacity_points:
          type: integer
          minimum: 0
          nullable: true
          description: Sprint capacity in story points
        status:
          $ref: '#/components/schemas/SprintStatus'
    SprintCloseResult:
      type: object
      required:
      - sprint_id
      - completed_items
      - moved_to_backlog
      - final_metrics
      properties:
        sprint_id:
          type: string
          format: uuid
          description: Closed sprint ID
        completed_items:
          type: integer
          description: Number of completed work items
        moved_to_backlog:
          type: integer
          description: Number of items moved to backlog
        final_metrics:
          $ref: '#/components/schemas/SprintMetrics'
          description: Final sprint metrics
    SprintMetrics:
      type: object
      required:
      - total_items
      - completed_items
      - in_progress_items
      - todo_items
      - committed_points
      - completed_points
      - completion_percentage
      properties:
        total_items:
          type: integer
          description: Total number of work items
        completed_items:
          type: integer
          description: Number of completed items
        in_progress_items:
          type: integer
          description: Number of in-progress items
        todo_items:
          type: integer
          description: Number of todo items
        blocked_items:
          type: integer
          description: Number of blocked items
        committed_points:
          type: integer
          description: Total committed story points
        completed_points:
          type: integer
          description: Completed story points
        remaining_points:
          type: integer
          description: Remaining story points
        completion_percentage:
          type: number
          format: float
          description: Completion percentage (0-100)
        velocity:
          type: number
          format: float
          nullable: true
          description: Sprint velocity (for completed sprints)
        days_remaining:
          type: integer
          nullable: true
          description: Days remaining in sprint
    BurndownData:
      type: object
      required:
      - sprint_id
      - data_points
      properties:
        sprint_id:
          type: string
          format: uuid
          description: Sprint ID
        data_points:
          type: array
          items:
            $ref: '#/components/schemas/BurndownPoint'
          description: Burndown chart data points
        ideal_line:
          type: array
          items:
            $ref: '#/components/schemas/BurndownPoint'
          description: Ideal burndown line
    BurndownPoint:
      type: object
      required:
      - date
      - remaining_points
      properties:
        date:
          type: string
          format: date
          description: Date
        remaining_points:
          type: integer
          description: Remaining story points
        completed_points:
          type: integer
          description: Completed story points on this day
    VelocityData:
      type: object
      required:
      - sprint_id
      - velocity
      - completed_points
      - committed_points
      properties:
        sprint_id:
          type: string
          format: uuid
          description: Sprint ID
        velocity:
          type: number
          format: float
          description: Sprint velocity (completed points)
        completed_points:
          type: integer
          description: Total completed story points
        committed_points:
          type: integer
          description: Total committed story points
        completion_rate:
          type: number
          format: float
          description: Completion rate percentage (0-100)
    CapacityCalculationRequest:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
          description: Team ID for historical velocity
        lookback_sprints:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Number of past sprints to consider
        adjustment_factor:
          type: number
          format: float
          minimum: 0.5
          maximum: 1.5
          default: 1.0
          description: Adjustment factor for capacity
    CapacityRecommendation:
      type: object
      required:
      - recommended_capacity
      - average_velocity
      - confidence_level
      properties:
        recommended_capacity:
          type: integer
          description: Recommended sprint capacity in story points
        average_velocity:
          type: number
          format: float
          description: Average velocity from historical data
        min_capacity:
          type: integer
          description: Minimum recommended capacity
        max_capacity:
          type: integer
          description: Maximum recommended capacity
        confidence_level:
          type: string
          enum:
          - low
          - medium
          - high
          description: Confidence level based on data quality
        historical_sprints:
          type: array
          items:
            $ref: '#/components/schemas/HistoricalSprintData'
          description: Historical sprint data used for calculation
    HistoricalSprintData:
      type: object
      required:
      - sprint_id
      - sprint_name
      - velocity
      - completion_rate
      properties:
        sprint_id:
          type: string
          format: uuid
        sprint_name:
          type: string
        velocity:
          type: number
          format: float
        completion_rate:
          type: number
          format: float
    ForecastRequest:
      type: object
      required:
      - remaining_points
      properties:
        remaining_points:
          type: integer
          minimum: 0
          description: Remaining story points to complete
        team_id:
          type: string
          format: uuid
          description: Team ID for historical velocity
        lookback_sprints:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Number of past sprints to consider
    ForecastResult:
      type: object
      required:
      - estimated_sprints
      - average_velocity
      - confidence_level
      properties:
        estimated_sprints:
          type: number
          format: float
          description: Estimated number of sprints to complete
        average_velocity:
          type: number
          format: float
          description: Average velocity used for forecast
        min_sprints:
          type: integer
          description: Minimum estimated sprints (optimistic)
        max_sprints:
          type: integer
          description: Maximum estimated sprints (pessimistic)
        confidence_level:
          type: string
          enum:
          - low
          - medium
          - high
          description: Confidence level based on data quality
        completion_date_estimate:
          type: string
          format: date
          nullable: true
          description: Estimated completion date
    WorkItemSummary:
      type: object
      required:
      - id
      - type
      - title
      - status
      - priority
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - epic
          - story
          - defect
        title:
          type: string
        status:
          type: string
          enum:
          - todo
          - in_progress
          - in_review
          - done
          - blocked
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        story_points:
          type: integer
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent work item ID (Epic for Story/Defect)
        sprint_id:
          type: string
          format: uuid
          nullable: true
        ticket_number:
          type: integer
          nullable: true
          description: Sequential ticket number within the project
        project_key:
          type: string
          nullable: true
          description: Project key for display (e.g., "SPRINT", "DND")
    SprintListResponse:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sprint'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Keycloak
security:
- BearerAuth: []
