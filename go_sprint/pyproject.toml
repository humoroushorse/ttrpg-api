[tool.poetry]
name = "go-sprint-tools"
version = "1.0.0"
description = "Python tools for go_sprint OpenAPI spec management"
authors = ["Sprint Management Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.8"
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
pylint = "^2.17.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ['py38']

[tool.pylint.messages_control]
max-line-length = 119
