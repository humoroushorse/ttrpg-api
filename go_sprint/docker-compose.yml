version: '3.8'

services:
  # Note: PostgreSQL is provided by the shared ttrpg-pg container
  # See deploy/postgres/postgres.compose.yml in the root directory
  # The sprint_management schema is created within the ttrpg-pg database
  # Start it with: docker-compose -f deploy/postgres/postgres.compose.yml up -d

  # NATS Message Broker
  nats:
    image: nats:2.10-alpine
    container_name: sprint-nats
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
      - "6222:6222"   # Cluster routing
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
      - "--max_payload=1048576"
      - "--max_connections=1000"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  nats_data:
    driver: local
