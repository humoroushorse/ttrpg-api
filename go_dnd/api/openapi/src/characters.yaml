tags:
- name: Characters
paths:
  /api/v1/characters/query:
    get:
      tags:
      - Characters
      operationId: queryCharacters
      summary: The caller's characters, by name (without levels)
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of the caller's characters
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/GenericListResponse'
                - type: object
                  properties:
                    entities:
                      type: array
                      items:
                        $ref: '#/components/schemas/Character'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/characters:
    post:
      tags:
      - Characters
      operationId: createCharacter
      summary: Create a character, for a campaign (which supplies the rules) or with its own rules
      description: 'Accepts a client-made `id` (uuidv7): resending the same create answers with the existing character
        instead of making a second one. Ability method and base scores start from the rules'' default (point buy:
        all 8s).'
      parameters:
      - $ref: '#/components/parameters/OpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterCreate'
      responses:
        '200':
          description: The character as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    get:
      tags:
      - Characters
      operationId: readCharacter
      summary: One of the caller's characters, with its planned levels (anyone else's is a 404)
      responses:
        '200':
          description: The character
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Characters
      operationId: updateCharacter
      summary: Change some fields; own rules merge; class_id changes the class on every planned level
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/OpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterPatch'
      responses:
        '200':
          description: The character as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Characters
      operationId: deleteCharacter
      summary: Soft delete. Returns the id
      responses:
        '200':
          description: The id
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/levels/{level}:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    - name: level
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 20
    put:
      tags:
      - Characters
      operationId: putCharacterLevel
      summary: Plan a level or change one
      description: 'Levels go up one at a time from 1, and every level has the same class until multiclassing (change
        it with PATCH class_id). hp_method is average (default) or manual with hp_value; rolled HP comes from the
        HP roll route. Planning levels above current_level is fine: they''re kept and apply when current_level reaches
        them.'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/OpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterLevelFields'
      responses:
        '200':
          description: The character as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Characters
      operationId: deleteCharacterLevel
      summary: Remove the top planned level (lower current_level to level down without losing the plan)
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/OpId'
      responses:
        '200':
          description: The character as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/choices:
    parameters:
    - &id001
      $ref: '#/components/parameters/EntityId'
    post:
      tags:
      - Characters
      operationId: createCharacterChoice
      summary: Add a choice (species, background, subclass, feat, asi, skill, ...) at the level it's made
      parameters:
      - &id002
        $ref: '#/components/parameters/IfMatch'
      - &id003
        $ref: '#/components/parameters/OpId'
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      description: 'Checked against the content rules and the hard rules: one species, background and subclass;
        species and background at level 1; a subclass of the character''s class at its level (a 2024 class at 3;
        no 2024 subclass on a 2014 class). A spell choice is a class''s per-level pick (cantrips, a Bard''s
        spells, a spellbook''s under the spellbook rule: slot class:<class>:cantrips:<level> and the like, from the
        sheet''s choice_points) or a feat''s or feature''s own pick with granted_by_id; a class''s other level 1+
        spells are prepared. A starting equipment pick (slot <class|background>:<slug>:equipment, value {"option": "A"},
        or its :equipment:pick with an item''s name) adds what it gives to the items and currency and records it in
        value.granted; replacing or removing it takes back the untouched items and the coins. Accepts a client-made id.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterChoiceFields'
  /api/v1/characters/{entity_id}/choices/{choice_id}:
    parameters:
    - *id001
    - $ref: '#/components/parameters/ChoiceId'
    put:
      tags:
      - Characters
      operationId: replaceCharacterChoice
      summary: Replace a choice (swap a background at level 10). Choices it granted stay linked
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterChoiceFields'
    delete:
      tags:
      - Characters
      operationId: deleteCharacterChoice
      summary: Remove a choice; a 409 while choices it granted remain (items it granted stay)
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/items:
    parameters:
    - *id001
    post:
      tags:
      - Characters
      operationId: createCharacterItem
      summary: 'Add an item: from the catalog (item_id) or custom (custom_name)'
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterItemFields'
  /api/v1/characters/{entity_id}/items/{item_id}:
    parameters:
    - *id001
    - $ref: '#/components/parameters/ItemId'
    patch:
      tags:
      - Characters
      operationId: updateCharacterItem
      summary: Change quantity, equipped, attuned, level_received, note, custom fields
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterItemPatch'
    delete:
      tags:
      - Characters
      operationId: deleteCharacterItem
      summary: Remove an item
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/prepared-spells/{spell_id}:
    parameters:
    - *id001
    - $ref: '#/components/parameters/SpellId'
    put:
      tags:
      - Characters
      operationId: prepareCharacterSpell
      summary: Prepare a level 1+ spell from the class's list (over or under the limit is allowed; the sheet warns)
      description: A 422 for a cantrip (cantrips are picked at each level) and for a class that learns its spells
        at each level instead (Bard, Sorcerer, Warlock). Under the spellbook rule, a spell outside the spellbook
        can be prepared; the sheet warns.
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Characters
      operationId: unprepareCharacterSpell
      summary: Unprepare a spell
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/modifiers:
    parameters:
    - *id001
    post:
      tags:
      - Characters
      operationId: createCharacterModifier
      summary: Add a boon or bane (+1 AC from the DM, a -2 Str curse, Mage Armor)
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterModifierFields'
  /api/v1/characters/{entity_id}/modifiers/{modifier_id}:
    parameters:
    - *id001
    - $ref: '#/components/parameters/ModifierId'
    patch:
      tags:
      - Characters
      operationId: updateCharacterModifier
      summary: 'Change a modifier (switch it off with active: false)'
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterModifierPatch'
    delete:
      tags:
      - Characters
      operationId: deleteCharacterModifier
      summary: Remove a modifier
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/ability-rolls:
    parameters:
    - *id001
    post:
      tags:
      - Characters
      operationId: rollCharacterAbilities
      summary: Roll a set of six scores (4d6, drop the lowest) on the server
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      description: Rerolls are allowed and counted (ability_roll_count); the character keeps the last rules.rolled_sets_kept
        sets.
  /api/v1/characters/{entity_id}/ability-scores:
    parameters:
    - *id001
    put:
      tags:
      - Characters
      operationId: setCharacterAbilityScores
      summary: Set the method and the six base scores (before any bonus)
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      description: 'point_buy: 8-15 each within the budget; standard_array: 15, 14, 13, 12, 10, 8 once each; rolled:
        one kept set''s totals (rolled_set is its index); manual: 3-18 each.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterAbilityScores'
  /api/v1/characters/{entity_id}/levels/{level}/hp-roll:
    parameters:
    - *id001
    - name: level
      in: path
      required: true
      schema:
        type: integer
        minimum: 2
        maximum: 20
    post:
      tags:
      - Characters
      operationId: rollCharacterLevelHP
      summary: Roll the class's hit die for a planned level (2-20); rerolls are kept, the newest counts
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/campaigns/{entity_id}/characters:
    parameters:
    - *id001
    get:
      tags:
      - Campaigns
      operationId: readCampaignCharacters
      summary: The campaign's characters, each with what breaks its current rules
      responses:
        '200':
          description: The campaign's characters, each with what breaks the rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCharacterList'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/campaigns/{entity_id}/rules/preview:
    parameters:
    - *id001
    post:
      tags:
      - Campaigns
      operationId: previewCampaignRules
      summary: What a rules change (merged like a PATCH) would flag; saves nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRules'
      responses:
        '200':
          description: The campaign's characters, each with what breaks the rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCharacterList'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/campaigns/{entity_id}/characters/{character_id}:
    parameters:
    - *id001
    - $ref: '#/components/parameters/CharacterId'
    post:
      tags:
      - Campaigns
      operationId: addCampaignCharacter
      summary: Add an existing character; a 409 with `issues` when it breaks the campaign's rules
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Campaigns
      operationId: removeCampaignCharacter
      summary: The character leaves the campaign (back to its own rules)
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/campaigns/{entity_id}/characters/{character_id}/exceptions/{ref_id}:
    parameters:
    - *id001
    - $ref: '#/components/parameters/CharacterId'
    - $ref: '#/components/parameters/RefId'
    put:
      tags:
      - Campaigns
      operationId: approveCampaignException
      summary: The DM accepts a catalog entry the character uses that breaks the campaign's rules
      description: It must break the current rules (a 422 otherwise). Approved, it stays in the character's issues
        marked `approved` (on the sheet as an `info` issue), and the change goes in the character's change log.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: The character with what breaks the campaign's rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCharacter'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Campaigns
      operationId: revokeCampaignException
      summary: Take back an approved exception
      responses:
        '200':
          description: The character with what breaks the campaign's rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCharacter'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/sheet/preview:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    post:
      tags:
      - Characters
      operationId: previewCharacterSheet
      summary: The sheet after some changes, without saving them
      description: Each operation runs exactly as its route would (the same checks), in one transaction that is then
        rolled back. A failing operation is answered with its error, `detail` prefixed with its index. Ability and HP
        rolls aren't operations (they're random).
      parameters:
      - name: level
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - operations
              additionalProperties: false
              properties:
                operations:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/SheetOperation'
      responses:
        '200':
          description: The sheet as it would be
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterSheet'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/options/{kind}:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - species
        - background
        - class
        - subclass
        - feat
        - spell
    get:
      tags:
      - Characters
      operationId: readCharacterOptions
      summary: What can be picked, with the rules applied
      description: Catalog entries for a pick. With `slot` (from the sheet's choice_points) the point's own filter
        applies (Origin feats, Wizard cantrips, the class's subclasses); without it, `spell` lists the class's level
        1+ spells to prepare, `learned` marking the spellbook's under the spellbook rule (a 422 for a class that
        learns its spells at each level). Every entry says whether it's `allowed` and why not (the content rules, a feat's prerequisites,
        a slot above the highest). `filters=off` lists rule-breaking entries as allowed, with the reasons as warnings;
        only for a character with its own rules (a campaign's rules are limits).
      parameters:
      - name: slot
        in: query
        schema:
          type: string
      - name: level
        in: query
        description: The level to check against (default current_level).
        schema:
          type: integer
          minimum: 1
          maximum: 20
      - name: name
        in: query
        description: Only entries whose name contains this (any case).
        schema:
          type: string
      - name: filters
        in: query
        schema:
          type: string
          enum:
          - 'on'
          - 'off'
      - name: allowed
        in: query
        description: Only allowed entries, plus the ones the character already has.
        schema:
          type: boolean
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The entries, each with allowed and its reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterOptions'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/sheet:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    get:
      tags:
      - Characters
      operationId: readCharacterSheet
      summary: 'The computed sheet: every number with its contributions, plus issues to look at'
      description: Computed at current_level, or at ?level= to preview another level (nothing changes). `not_computed`
        lists what the sheet can't work out until the catalog has the data (spellcasting, feat and trait effects,
        attacks).
      parameters:
      - name: level
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
      responses:
        '200':
          description: The sheet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterSheet'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/editors:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Characters]
      operationId: listCharacterEditors
      summary: Who the owner lets edit the character (the owner and its editors see this)
      responses:
        '200':
          description: The editors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterEditorList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Characters]
      operationId: addCharacterEditor
      summary: Let someone edit the character (its owner), by user_id or username
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SomeUser'}
      responses:
        '200':
          description: The editors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterEditorList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/characters/{entity_id}/editors/{user_id}:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Characters]
      operationId: removeCharacterEditor
      summary: Take someone off the editors (its owner), or yourself
      responses:
        '200':
          description: The editors (empty for an editor who took themselves off)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterEditorList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/characters/{entity_id}/transfer:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Characters]
      operationId: readCharacterTransfer
      summary: The owner's pending offer to hand the character over
      responses:
        '200':
          description: The offer, or null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterTransferResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Characters]
      operationId: offerCharacterTransfer
      summary: Offer the character to someone (its owner); they accept before it expires (7d by default)
      description: Replaces an earlier offer. A character in a campaign goes only to one of its members.
        Accepting clears the editors; the campaign link and DM gifts stay.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CharacterTransferOffer'}
      responses:
        '200':
          description: The offer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterTransferResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Characters]
      operationId: cancelCharacterTransfer
      summary: Take the offer back (its owner)
      responses:
        '200':
          description: No offer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterTransferResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/character-transfers:
    get:
      tags: [Characters]
      operationId: listIncomingTransfers
      summary: Characters offered to the caller
      responses:
        '200':
          description: The offers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncomingTransferList'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/character-transfers/{character_id}/accept:
    parameters:
    - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Characters]
      operationId: acceptCharacterTransfer
      summary: Become the character's owner
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterDetail'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/character-transfers/{character_id}/decline:
    parameters:
    - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Characters]
      operationId: declineCharacterTransfer
      summary: Turn the offer down
      responses:
        '200':
          description: The caller's other offers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncomingTransferList'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/campaigns/{entity_id}/characters/{character_id}/gifts:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Campaigns]
      operationId: createCampaignGift
      summary: A DM gives a character in the campaign items, coins (added) and boons or banes
      description: The player owns a gift once given, except that a custom item's name and description, and a
        boon or bane, stay the campaign's DMs' to change. A gift's boons and banes count only while the character
        is in the campaign. A DM takes back a gift item (DELETE on the item) only while nobody has changed it.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignGift'}
      responses:
        '200':
          description: The character as stored, with its whole build
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterDetail'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      description: The character's version; the write is a 409 if it has changed since.
      schema:
        type: string
    OpId:
      name: Op-Id
      in: header
      description: A uuid for this operation; an operation already applied (an offline replay) isn't applied again.
      schema:
        type: string
        format: uuid
    ChoiceId:
      name: choice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpellId:
      name: spell_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModifierId:
      name: modifier_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CharacterId:
      name: character_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefId:
      name: ref_id
      in: path
      required: true
      description: The catalog entry's id (the issue's id).
      schema:
        type: string
        format: uuid
  schemas:
    CharacterCreate:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Optional client-made uuidv7.
        name:
          type: string
        campaign_id:
          type: string
          format: uuid
          nullable: true
        rules:
          $ref: '#/components/schemas/CampaignRules'
        current_level:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        currency:
          type: object
          additionalProperties: true
          description: '{cp, sp, ep, gp, pp}'
        details:
          type: object
          additionalProperties: true
    CharacterPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        current_level:
          type: integer
          minimum: 1
          maximum: 20
        currency:
          type: object
          additionalProperties: true
        details:
          type: object
          additionalProperties: true
        rules:
          $ref: '#/components/schemas/CampaignRules'
        class_id:
          type: string
          format: uuid
    CharacterLevelFields:
      type: object
      additionalProperties: false
      properties:
        class_id:
          type: string
          format: uuid
          description: Required for a new level.
        hp_method:
          type: string
          enum:
          - average
          - manual
        hp_value:
          type: integer
          nullable: true
          minimum: 1
    CharacterLevel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        level:
          type: integer
        class:
          type: object
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            name:
              type: string
            dnd_version_year:
              type: integer
            source_slug:
              type: string
        hp_method:
          type: string
        hp_value:
          type: integer
          nullable: true
        hp_rolls:
          type: array
          items: {}
    Character:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        campaign_id:
          type: string
          format: uuid
          nullable: true
        current_level:
          type: integer
        rules:
          $ref: '#/components/schemas/CampaignRules'
        viewer:
          type: object
          description: What the caller may do with it (the list fills in owner and editor only).
          properties:
            owner: {type: boolean}
            editor: {type: boolean}
            campaign_role: {type: string, description: 'dm, player, or empty when not in its campaign.'}
            can_edit: {type: boolean}
            can_give: {type: boolean}
            can_manage: {type: boolean, description: 'Delete it, choose its editors, hand it over, move it between campaigns.'}
        rules_from:
          type: string
          enum:
          - campaign
          - character
        ability_method:
          type: string
        base_scores:
          type: object
          additionalProperties: true
        ability_rolls:
          type: array
          items: {}
        ability_roll_count:
          type: integer
        currency:
          type: object
          additionalProperties: true
        details:
          type: object
          additionalProperties: true
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
          nullable: true
    CharacterChoiceFields:
      type: object
      required:
      - level
      - kind
      - slot
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Optional client-made uuidv7.
        level:
          type: integer
          minimum: 1
          maximum: 20
        kind:
          type: string
          enum:
          - species
          - subclass
          - background
          - feat
          - asi
          - skill
          - expertise
          - tool
          - language
          - fighting_style
          - equipment_option
          - spell
          - saving_throw
          - resistance
          - spellcasting_ability
          - option
        slot:
          type: string
          description: The choice point it answers; the sheet's choice_points list the slots (class:wizard:skills,
            feat:magic-initiate:grant_spell:wizard).
        granted_by_id:
          type: string
          format: uuid
          nullable: true
          description: The choice that made this one possible.
        species_id: &id004
          type: string
          format: uuid
          nullable: true
        subclass_id: *id004
        background_id: *id004
        feat_id: *id004
        spell_id: *id004
        item_id: *id004
        value:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Picks that aren''t catalog rows: {"skill": "arcana"}, {"increases": {"int": 2, "wis": 1}},
            {"ability": "con"} (saving_throw, spellcasting_ability), {"damage_type": "fire"}, {"option": "Wizard"}.'
        overrides_filter:
          type: boolean
          default: false
          description: Pick it outside the character's own rules (not for campaign characters).
    CharacterItemFields:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        item_id: *id004
        granted_by_id: *id004
        custom_name:
          type: string
          nullable: true
        custom_description:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 0
          default: 1
        equipped:
          type: boolean
        attuned:
          type: boolean
        level_received:
          type: integer
          nullable: true
          minimum: 1
          maximum: 20
          description: Hidden while current_level is below it.
        note:
          type: string
          nullable: true
          description: from Gerald, session 3
    CharacterItemPatch:
      type: object
      additionalProperties: false
      properties:
        custom_name:
          type: string
          nullable: true
        custom_description:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 0
          default: 1
        equipped:
          type: boolean
        attuned:
          type: boolean
        level_received:
          type: integer
          nullable: true
          minimum: 1
          maximum: 20
          description: Hidden while current_level is below it.
        note:
          type: string
          nullable: true
          description: from Gerald, session 3
    CharacterModifierFields:
      type: object
      required:
      - label
      - target
      - op
      - value
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        note:
          type: string
          nullable: true
        target:
          type: string
          description: ac, ability.str, skill.stealth, save.dex, speed.walk, hp.max, initiative, ...
        op:
          type: string
          enum:
          - add
          - set
          - base
          - min
          - max
          - adv
          - disadv
          - resist
          - immune
          - vuln
          - condition_immune
          - grant
        value:
          description: '2, -1, {"dice": "1d4"}'
        from_level:
          type: integer
          nullable: true
          minimum: 1
          maximum: 20
        active:
          type: boolean
          default: true
        added_as:
          type: string
          enum:
          - player
          - dm
          default: player
    CharacterModifierPatch:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        note:
          type: string
          nullable: true
        target:
          type: string
          description: ac, ability.str, skill.stealth, save.dex, speed.walk, hp.max, initiative, ...
        op:
          type: string
          enum:
          - add
          - set
          - base
          - min
          - max
          - adv
          - disadv
          - resist
          - immune
          - vuln
          - condition_immune
          - grant
        value:
          description: '2, -1, {"dice": "1d4"}'
        from_level:
          type: integer
          nullable: true
          minimum: 1
          maximum: 20
        active:
          type: boolean
          default: true
        added_as:
          type: string
          enum:
          - player
          - dm
          default: player
    CharacterAbilityScores:
      type: object
      required:
      - method
      - scores
      additionalProperties: false
      properties:
        method:
          type: string
          enum:
          - point_buy
          - standard_array
          - rolled
          - manual
        scores:
          type: object
          required:
          - str
          - dex
          - con
          - int
          - wis
          - cha
          additionalProperties: false
          properties:
            str:
              type: integer
            dex:
              type: integer
            con:
              type: integer
            int:
              type: integer
            wis:
              type: integer
            cha:
              type: integer
        rolled_set:
          type: integer
          nullable: true
          description: 'For rolled: the index of the kept set in ability_rolls.'
    CharacterIssue:
      type: object
      properties:
        category:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        reason:
          type: string
        approved:
          type: boolean
          description: The DM accepted it as an exception.
        note:
          type: string
          nullable: true
          description: The DM's note on the exception.
    CampaignCharacter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        current_level:
          type: integer
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string
          nullable: true
        class_name:
          type: string
          description: Empty before a class is picked.
        species_name:
          type: string
        issues:
          type: array
          description: For the campaign's DMs and the character's own player; empty for the other players.
          items:
            $ref: '#/components/schemas/CharacterIssue'
    CampaignCharacterList:
      allOf:
      - $ref: '#/components/schemas/GenericListResponse'
      - type: object
        properties:
          entities:
            type: array
            items:
              $ref: '#/components/schemas/CampaignCharacter'
    SheetOperation:
      type: object
      description: 'One change, as its route takes it: `body` is that route''s request body. choice.add,
        choice.replace and choice.remove (choice_id), level.set and level.remove (level), scores.set,
        character.update, item.add, item.update and item.remove (item_id), spell.prepare and spell.unprepare
        (spell_id), modifier.add, modifier.update and modifier.remove (modifier_id).'
      required:
      - op
      additionalProperties: false
      properties:
        op:
          type: string
          enum:
          - choice.add
          - choice.replace
          - choice.remove
          - level.set
          - level.remove
          - scores.set
          - character.update
          - item.add
          - item.update
          - item.remove
          - spell.prepare
          - spell.unprepare
          - modifier.add
          - modifier.update
          - modifier.remove
        choice_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        spell_id:
          type: string
          format: uuid
        modifier_id:
          type: string
          format: uuid
        level:
          type: integer
          minimum: 1
          maximum: 20
        body:
          type: object
          additionalProperties: true
    CharacterOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        source_slug:
          type: string
        dnd_version_year:
          type: integer
        allowed:
          type: boolean
        reasons:
          type: array
          description: Why it isn't allowed (or, with filters=off, why it would break the rules).
          items:
            type: string
        chosen:
          type: boolean
          description: The character already has it (picked or prepared).
        category:
          type: string
          description: A feat's category.
        level:
          type: integer
          description: A spell's level.
        learned:
          type: boolean
          description: A spell to prepare that's in the spellbook (the spellbook rule).
    CharacterOptions:
      allOf:
      - $ref: '#/components/schemas/GenericListResponse'
      - type: object
        properties:
          kind:
            type: string
          slot:
            type: string
            nullable: true
          level:
            type: integer
          entities:
            type: array
            items:
              $ref: '#/components/schemas/CharacterOption'
    CharacterDetail:
      allOf:
      - $ref: '#/components/schemas/Character'
      - type: object
        properties:
          levels:
            type: array
            items:
              $ref: '#/components/schemas/CharacterLevel'
          choices:
            type: array
            items:
              type: object
              additionalProperties: true
          items:
            type: array
            items:
              type: object
              additionalProperties: true
          prepared_spells:
            type: array
            items:
              type: object
              additionalProperties: true
          modifiers:
            type: array
            items:
              type: object
              additionalProperties: true
    SheetContribution:
      type: object
      properties:
        source:
          type: string
        op:
          type: string
        value:
          type: integer
        note:
          type: string
    SheetStat:
      type: object
      properties:
        value:
          type: integer
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/SheetContribution'
        inactive:
          type: array
          items:
            $ref: '#/components/schemas/SheetContribution'
        roll:
          type: string
          enum:
          - advantage
          - disadvantage
          - normal
        advantage:
          type: array
          items:
            type: string
        disadvantage:
          type: array
          items:
            type: string
    SheetSave:
      allOf:
      - $ref: '#/components/schemas/SheetStat'
      - type: object
        properties:
          proficient:
            type: boolean
    SheetSkill:
      allOf:
      - $ref: '#/components/schemas/SheetStat'
      - type: object
        required: [ability, proficient, expertise, proficiency]
        properties:
          ability:
            type: string
            enum: [str, dex, con, int, wis, cha]
          proficient:
            type: boolean
          expertise:
            type: boolean
            description: Expertise was picked; it only counts with proficiency.
          proficiency:
            type: string
            enum: [none, half, proficient, expertise]
            description: What the bonus adds. half is half the proficiency bonus (Jack of All Trades); expertise
              is counted expertise (with proficiency).
    SheetLimit:
      type: object
      nullable: true
      properties:
        limit:
          type: integer
        chosen:
          type: integer
    SheetChoicePoint:
      type: object
      properties:
        slot:
          type: string
        kinds:
          type: array
          items:
            type: string
        source:
          type: string
        granted_by_id:
          type: string
        level:
          type: integer
        count:
          type: integer
        chosen:
          type: integer
        choice_ids:
          type: array
          description: The ids of the choices that answer it (left out when none do).
          items:
            type: string
        from:
          type: array
          items:
            type: string
        any:
          type: boolean
        amount:
          type: integer
          description: An ability increase's most per ability.
        ability_count:
          type: integer
          description: An ability increase gives amount × ability_count points.
        spell_filter:
          type: object
          properties:
            level:
              type: integer
              description: Exactly this spell level (0 is a cantrip).
            min_level:
              type: integer
            max_level:
              type: integer
              description: A class's spells go up to the highest slot at the point's level.
            classes:
              type: array
              items:
                type: string
            schools:
              type: array
              items:
                type: string
            ritual:
              type: boolean
        text:
          type: string
        open:
          type: boolean
          description: Takes any number (spells copied into a spellbook); count is however many are chosen.
        options:
          type: array
          description: What each value in `from` gives (the starting equipment packages).
          items:
            type: object
            required: [label, text]
            properties:
              label:
                type: string
              text:
                type: string
    CharacterSheet:
      type: object
      description: Maps are keyed by ability (str...) or skill (arcana, sleight_of_hand...) codes.
      properties:
        level:
          type: integer
        proficiency_bonus:
          $ref: '#/components/schemas/SheetStat'
        abilities:
          type: object
          additionalProperties:
            type: object
            properties:
              score:
                $ref: '#/components/schemas/SheetStat'
              modifier:
                type: integer
        saving_throws:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SheetSave'
        skills:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SheetSkill'
        passive:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SheetStat'
        initiative:
          $ref: '#/components/schemas/SheetStat'
        armor_class:
          $ref: '#/components/schemas/SheetStat'
        hit_points:
          type: object
          properties:
            max:
              $ref: '#/components/schemas/SheetStat'
            hit_dice:
              type: string
        speed:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SheetStat'
        senses:
          type: object
          description: darkvision, blindsight, ...; the value is the range in feet.
          additionalProperties:
            $ref: '#/components/schemas/SheetStat'
        size:
          type: string
        features:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              level:
                type: integer
              source:
                type: string
        proficiencies:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        resistances:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - resistance
                - immunity
                - vulnerability
              against:
                type: string
                description: A damage type (fire) or a condition (charmed).
              source:
                type: string
        conditional:
          type: array
          description: Advantage or disadvantage that only applies sometimes (saves to end the Poisoned condition).
          items:
            type: object
            properties:
              mod:
                type: string
              'on':
                type: array
                items:
                  type: string
              condition:
                type: string
              source:
                type: string
              text:
                type: string
        attacks:
          type: array
          description: Equipped weapons, then the unarmed strike.
          items:
            type: object
            properties:
              name:
                type: string
              kind:
                type: string
                enum:
                - melee
                - ranged
              ability:
                type: string
              proficient:
                type: boolean
              bonus:
                $ref: '#/components/schemas/SheetStat'
              damage:
                type: string
                description: '"1d8+3 Slashing"'
              versatile:
                type: string
              range:
                type: string
              properties:
                type: array
                items:
                  type: string
              mastery:
                type: string
        spellcasting:
          type: object
          nullable: true
          description: The class's (or a casting subclass's) spellcasting; null when the character doesn't cast.
            Over or under a limit is a warning in issues, not an error.
          properties:
            source:
              type: string
            ability:
              type: string
            save_dc:
              $ref: '#/components/schemas/SheetStat'
            attack:
              $ref: '#/components/schemas/SheetStat'
            cantrips:
              $ref: '#/components/schemas/SheetLimit'
            prepared:
              $ref: '#/components/schemas/SheetLimit'
            change:
              type: string
              enum: [long_rest, level_up]
              description: 'long_rest: level 1+ spells are prepared from the class''s list (prepared_spells). level_up:
                they''re picked at each level (choice points), like cantrips for every class.'
            has_spellbook:
              type: boolean
              description: The class keeps a spellbook (Wizard), so the spellbook rule applies to it.
            spellbook_rule:
              type: boolean
              description: The spellbook rule is on for this character.
            slots:
              type: array
              description: Spell slots for spell levels 1-9.
              items:
                type: integer
            pact_slots:
              type: integer
            pact_slot_level:
              type: integer
        spells:
          type: array
          description: Spells from feats and species traits (class spells are prepared_spells).
          items:
            type: object
            properties:
              spell:
                type: string
                description: A fixed spell's catalog slug.
              name:
                type: string
                description: A picked spell's name.
              source:
                type: string
              uses:
                type: string
              ability:
                type: string
              save_dc:
                type: integer
              attack:
                type: integer
              note:
                type: string
        class_table:
          type: object
          description: The class table's other columns at this level (Rages, Sneak Attack, ...).
          additionalProperties: true
        choice_points:
          type: array
          description: Every pick the build asks for. Answer one with choices that have this slot, granted_by_id
            and one of these kinds.
          items:
            $ref: '#/components/schemas/SheetChoicePoint'
        issues:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                description: info is an approved exception
                enum:
                - error
                - warning
                - info
              code:
                type: string
              message:
                type: string
        not_computed:
          type: array
          items:
            type: string
    SomeUser:
      type: object
      additionalProperties: false
      description: A user who has signed in, by id or by username.
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
    CharacterEditor:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string, nullable: true}
        profile_picture_url: {type: string, nullable: true}
        added_at: {type: string, format: date-time}
        me: {type: boolean, description: the caller}
    CharacterEditorList:
      type: object
      properties:
        entities:
          type: array
          items: {$ref: '#/components/schemas/CharacterEditor'}
    CharacterTransferOffer:
      type: object
      additionalProperties: false
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
        expires_in: {type: string, enum: [1h, 1d, 7d], default: 7d}
    CharacterTransferResponse:
      type: object
      properties:
        transfer:
          type: object
          nullable: true
          properties:
            to_user_id: {type: string, format: uuid}
            to_username: {type: string, nullable: true}
            expires_at: {type: string, format: date-time}
            created_at: {type: string, format: date-time}
    IncomingTransfer:
      type: object
      properties:
        character_id: {type: string, format: uuid}
        character_name: {type: string}
        current_level: {type: integer}
        from_username: {type: string, nullable: true}
        campaign_id: {type: string, format: uuid, nullable: true}
        campaign_name: {type: string, nullable: true}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    IncomingTransferList:
      type: object
      properties:
        entities:
          type: array
          items: {$ref: '#/components/schemas/IncomingTransfer'}
    CampaignGift:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              item_id: {type: string, format: uuid}
              custom_name: {type: string}
              custom_description: {type: string}
              quantity: {type: integer, minimum: 1, default: 1}
              note: {type: string}
        currency:
          type: object
          description: Coins added, {cp, sp, ep, gp, pp}, each 0 or more.
          additionalProperties: {type: integer, minimum: 0}
        modifiers:
          type: array
          description: Boons and banes, as CharacterModifierFields (added_as is dm; they start active).
          items:
            type: object
            additionalProperties: true
