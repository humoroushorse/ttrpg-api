  /api/v1/spells/{source_slug}/{slug}:
    get:
      tags:
      - Spells
      operationId: readSpellBySlugs
      summary: One spell by its source's slug and its own (phb_2024/acid-splash), the UI's URL key
      parameters:
      - name: source_slug
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The spell
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spell'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/vtt/campaigns/{entity_id}/scenes:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    get:
      tags:
      - Tabletop
      operationId: listVttScenes
      summary: The campaign's scenes (DMs, as a tree by parent_id and sort_order); a player gets only the one they're
        on
      responses:
        '200':
          description: The scenes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VttSceneList'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Tabletop
      operationId: createVttScene
      summary: Create a scene, last among its siblings (DMs). It isn't shown to players until it's activated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VttSceneFields'
      responses:
        '200':
          description: The scene
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VttScene'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/vtt/scenes/{entity_id}:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    patch:
      tags:
      - Tabletop
      operationId: updateVttScene
      summary: Change some fields, or move the scene in the tree (DMs). A move under its own subtree is a 422
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VttSceneFields'
      responses:
        '200':
          description: The scene
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VttScene'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Tabletop
      operationId: deleteVttScene
      summary: Move the scene and everything under it to the trash (DMs). A 409 while anyone is on one of them
      responses:
        '200':
          description: The ids trashed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/vtt/campaigns/{entity_id}/active-scene:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    put:
      tags:
      - Tabletop
      operationId: setVttActiveScene
      summary: Move everyone to a scene (DMs); null takes the table down. Players the DM had moved elsewhere come
        too
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VttSceneChoice'
      responses:
        '200':
          description: The event's seq
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VttCommandResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/vtt/campaigns/{entity_id}/members/{user_id}/scene:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    - $ref: '#/components/parameters/UserId'
    put:
      tags:
      - Tabletop
      operationId: setVttMemberScene
      summary: Move one player to a scene (DMs, for a split party); null sends them back to the active scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VttSceneChoice'
      responses:
        '200':
          description: The event's seq
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VttCommandResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/vtt/campaigns/{entity_id}/state:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    get:
      tags:
      - Tabletop
      operationId: readVttState
      summary: A scene and its tokens as the caller may see them, and the seq to stream from
      parameters:
      - name: scene
        in: query
        description: The scene (DMs any; players only the one they're on). Default the caller's current scene.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VttState'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/vtt/campaigns/{entity_id}/commands:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    post:
      tags:
      - Tabletop
      operationId: postVttCommand
      summary: Do something at the table; everyone sees it on their stream
      description: '`token.move` (DMs any token; players their characters'' tokens and the markers those characters
        control), `token.add`, `token.update` and `token.remove` (DMs), and `ping` (anyone, not saved). Every command
        names its `scene_id`. A `command_id` already applied answers with that event''s seq and changes nothing.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VttCommand'
      responses:
        '200':
          description: The event's seq (null for a ping), and the token for token.add and token.update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VttCommandResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/vtt/campaigns/{entity_id}/events:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    get:
      tags:
      - Tabletop
      operationId: streamVttEvents
      summary: Server-sent events for the whole campaign, built for the caller
      description: 'One stream per user per campaign. Each saved event is `id: <seq>`, `event: <type>`, `data: <VttEvent>`;
        pings have no id. A `reload` event means the caller must load the state again and reconnect from its seq
        (the gap is too big, or past the log''s 90 days). The stream closes when the caller''s session expires or
        they leave the campaign. A comment line every 20 s keeps proxies from closing it.'
      parameters:
      - name: after
        in: query
        description: Replay events after this seq (from the state). Last-Event-ID wins when both are sent.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: Last-Event-ID
        in: header
        description: Sent by EventSource when it reconnects.
        schema:
          type: string
      responses:
        '200':
          description: The stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DndUser'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Users
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DndUser'
        '403':
          description: Forbidden - can only update own profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - detail
      - error
      - code
      properties:
        detail:
          type: string
          description: The message (py_dnd's FastAPI field; what the UI reads).
        error:
          type: string
        code:
          type: string
        trace_id:
          type: string
    BulkLoadResponse:
      type: object
      required:
      - filename
      - totals
      - created
      - updated
      - unchanged
      - errors
      - warnings
      properties:
        filename:
          type: string
        totals:
          type: object
          properties:
            created:
              type: integer
            updated:
              type: integer
            unchanged:
              type: integer
            errored:
              type: integer
            warning:
              type: integer
        created:
          type: array
          items:
            type: string
        updated:
          type: array
          description: 'Existing rows the upload changed ("slug (source): field, field").'
          items:
            type: string
        unchanged:
          type: array
          items:
            type: string
        errors:
          type: array
          description: Any error means nothing was saved.
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    GenericListResponse:
      type: object
      properties:
        total_entities_count:
          type: integer
          description: How many entities match (excluding limit/offset).
        limit:
          type: integer
        offset:
          type: integer
        filters:
          type: object
          additionalProperties: true
        entities_count:
          type: integer
        entities:
          type: array
          items: {}
    CampaignRules:
      type: object
      description: 'The character-building rule set (CHARACTER_PLAN.md section 3). Writes fill in every field left
        out; unknown fields are a 422. In a PATCH, it merges into the current rules, and `other_edition.by_category.<category>:
        null` removes that override.'
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          enum:
          - 1
        edition:
          type: integer
          enum:
          - 2014
          - 2024
          description: The base edition.
        other_edition:
          type: object
          additionalProperties: false
          properties:
            default:
              type: string
              enum:
              - never
              - if_missing
              - always
            by_category:
              type: object
              description: Keys are species, class, subclass, background, feat, spell, item.
              additionalProperties:
                type: string
                enum:
                - never
                - if_missing
                - always
                nullable: true
        allow_unearthed_arcana:
          type: boolean
        allow_playtest:
          type: boolean
        sources:
          type: object
          additionalProperties: false
          properties:
            allow:
              type: array
              nullable: true
              description: Source slugs; null allows every source.
              items:
                type: string
            block:
              type: array
              items:
                type: string
        ability_score_methods:
          type: array
          items:
            type: string
            enum:
            - point_buy
            - standard_array
            - rolled
            - manual
        ability_score_default:
          type: string
          enum:
          - point_buy
          - standard_array
          - rolled
          - manual
        point_buy_budget:
          type: integer
          minimum: 0
          maximum: 200
        rolled_sets_kept:
          type: integer
          minimum: 1
          maximum: 100
        hp_methods:
          type: array
          items:
            type: string
            enum:
            - average
            - rolled
            - manual
        hp_default:
          type: string
          enum:
          - average
          - rolled
          - manual
        optional_rules:
          type: object
          description: Stored and shown; not enforced yet, except spellbook.
          additionalProperties: false
          properties:
            feats:
              type: boolean
            custom_origin:
              type: boolean
            optional_class_features:
              type: boolean
            encumbrance:
              type: string
              enum:
              - 'off'
              - standard
              - variant
            multiclass_prerequisites:
              type: boolean
            spellbook:
              type: boolean
              description: A class with a spellbook (Wizard) learns its spells into it at each level (choice points)
                and prepares from it; preparing a spell outside it is a warning, not a block.
    CampaignAccessSettings:
      type: object
      additionalProperties: false
      description: Who may invite, and how much of the party's characters players see.
      properties:
        invite:
          type: string
          enum:
          - dms
          - members
          description: Default dms.
        party_sheets:
          type: string
          enum:
          - summary
          - full
          description: 'summary (default): the party list. full: each character''s sheet, read-only.'
    CampaignSettings:
      type: object
      additionalProperties: false
      description: In a PATCH, access merges into the current access settings.
      properties:
        access:
          $ref: '#/components/schemas/CampaignAccessSettings'
    CampaignFields:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        rules:
          $ref: '#/components/schemas/CampaignRules'
        settings:
          $ref: '#/components/schemas/CampaignSettings'
    CampaignPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        rules:
          $ref: '#/components/schemas/CampaignRules'
        settings:
          $ref: '#/components/schemas/CampaignSettings'
    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        rules:
          $ref: '#/components/schemas/CampaignRules'
        settings:
          type: object
          additionalProperties: true
          description: '{access: {invite, party_sheets}} with defaults filled in; the VTT''s settings later.'
        role:
          type: string
          enum:
          - dm
          - player
          description: The caller's role in it.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
          nullable: true
    CampaignMember:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
          nullable: true
        profile_picture_url:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - dm
          - player
        owner:
          type: boolean
          description: The permanent DM.
        me:
          type: boolean
          description: The caller.
        joined_at:
          type: string
          format: date-time
    CampaignMemberList:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/CampaignMember'
    CampaignMemberPatch:
      type: object
      required:
      - role
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - dm
          - player
    CampaignInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - link
          - user
        username:
          type: string
          nullable: true
          description: A user invite's invitee.
        invited_by:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: integer
          nullable: true
        uses:
          type: integer
        created_at:
          type: string
          format: date-time
    CampaignInviteList:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/CampaignInvite'
    CampaignInviteCreate:
      type: object
      additionalProperties: false
      properties:
        expires_in:
          type: string
          enum:
          - 1h
          - 1d
          - 7d
          default: 1d
        max_uses:
          type: integer
          minimum: 1
          nullable: true
          description: A link's limit; none by default.
        username:
          type: string
          description: Invite this user instead of making a link.
    CampaignInviteCreated:
      type: object
      properties:
        invite:
          $ref: '#/components/schemas/CampaignInvite'
        token:
          type: string
          nullable: true
          description: 'A link''s token, shown only now: /dnd/campaigns/join/<token>.'
    InviteLinkPreview:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        campaign_name:
          type: string
        invited_by:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
        member:
          type: boolean
          description: The caller is already in it.
    MyInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        campaign_name:
          type: string
        invited_by:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    MyInviteList:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/MyInvite'
    Background:
      description: As the API returns it. ?fields= leaves the other fields out.
      properties:
        ability_score_bonuses:
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          format: uuid
          nullable: true
          type: string
        description:
          description: Also accepted as description_html.
          type: string
        dnd_version:
          type: string
        dnd_version_year:
          type: integer
        equipment_options:
          items: {}
          type: array
        equipment_text:
          type: string
        feat:
          type: string
        id:
          format: uuid
          type: string
        is_homebrew:
          type: boolean
        is_unearthed_arcana:
          type: boolean
        marks:
          items:
            type: string
          type: array
        name:
          type: string
        skill_proficiencies:
          items:
            type: string
          type: array
        slug:
          type: string
        source:
          $ref: '#/components/schemas/SourceRef'
        source_id:
          format: uuid
          type: string
        tool_proficiencies:
          items:
            type: string
          type: array
        updated_at:
          format: date-time
          type: string
        updated_by:
          format: uuid
          nullable: true
          type: string
      type: object
    BackgroundFields:
      additionalProperties: false
      description: Every field a client writes. Unknown keys are a 422.
      properties:
        ability_score_bonuses:
          type: string
        description:
          description: Also accepted as description_html.
          type: string
        dnd_version:
          type: string
        dnd_version_year:
          type: integer
        equipment_options:
          items: {}
          type: array
        equipment_text:
          type: string
        feat:
          type: string
        is_homebrew:
          type: boolean
        is_unearthed_arcana:
          type: boolean
        marks:
          items:
            type: string
          type: array
        name:
          type: string
        skill_proficiencies:
          items:
            type: string
          type: array
        slug:
          type: string
        source_id:
          format: uuid
          type: string
        tool_proficiencies:
          items:
            type: string
          type: array
      required:
      - source_id
      - slug
      - name
      - dnd_version
      - dnd_version_year
      - description
      type: object
    BackgroundPatch:
      additionalProperties: true
      description: Only the fields to change (any of BackgroundFields).
      type: object
    Class:
      description: As the API returns it. ?fields= leaves the other fields out.
      properties:
        caster_progression:
          nullable: true
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          format: uuid
          nullable: true
          type: string
        description:
          description: Also accepted as description_html.
          type: string
        dnd_version:
          type: string
        dnd_version_year:
          type: integer
        features:
          items: {}
          type: array
        hit_die:
          type: string
        hit_die_size:
          nullable: true
          type: integer
        id:
          format: uuid
          type: string
        is_homebrew:
          type: boolean
        is_unearthed_arcana:
          type: boolean
        level_table:
          items: {}
          type: array
        marks:
          items:
