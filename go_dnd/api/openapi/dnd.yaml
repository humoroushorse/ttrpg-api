          type: boolean
          nullable: true
        has_summon:
          type: boolean
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
          nullable: true
        source:
          $ref: '#/components/schemas/SourceRef'
    VttBackgroundSource:
      type: object
      required:
      - url
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: An http(s) URL.
        type:
          type: string
          enum:
          - image/avif
          - image/webp
          - image/png
          - image/jpeg
          - image/gif
          description: Lets the client skip a format the browser can't decode.
    VttSceneFields:
      type: object
      additionalProperties: false
      description: A create needs name, width_cells and height_cells; anything else left out gets its default. In
        a PATCH only the fields sent change, and parent_id null moves the scene to the top level.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parent_id:
          type: string
          format: uuid
          nullable: true
        sort_order:
          type: integer
        background_sources:
          type: array
          maxItems: 5
          description: Copies of the map, best first (avif, webp, png). Empty is a blank grid.
          items:
            $ref: '#/components/schemas/VttBackgroundSource'
        grid_type:
          type: string
          enum:
          - square
          - none
          default: square
        width_cells:
          type: integer
          minimum: 1
          maximum: 500
        height_cells:
          type: integer
          minimum: 1
          maximum: 500
        cell_px:
          type: number
          minimum: 8
          maximum: 1024
          default: 70
          description: Image pixels per cell.
        grid_offset_x:
          type: number
          default: 0
          description: Where the first cell starts on the image
          in pixels.: null
        grid_offset_y:
          type: number
          default: 0
        grid_distance:
          type: number
          exclusiveMinimum: true
          minimum: 0
          default: 5
          description: What a cell is worth.
        grid_units:
          type: string
          minLength: 1
          maxLength: 10
          default: ft
        settings:
          $ref: '#/components/schemas/VttSceneSettings'
    VttSceneSettings:
      type: object
      additionalProperties: false
      properties:
        token_reveal:
          type: string
          enum:
          - numbers
          - names
          default: numbers
          description: 'How a hostile marker shows up for players when the DM doesn''t name it for them: just its
            number ("#3"), or its own name.'
        grid_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          default: '#000000'
        grid_opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 0.25
    VttScene:
      type: object
      required:
      - id
      - campaign_id
      - name
      - background_sources
      - grid_type
      - width_cells
      - height_cells
      - cell_px
      - grid_offset_x
      - grid_offset_y
      - grid_distance
      - grid_units
      - settings
      - sort_order
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Null for players too (the tree is DM-only).
        sort_order:
          type: integer
        name:
          type: string
        background_sources:
          type: array
          items:
            $ref: '#/components/schemas/VttBackgroundSource'
        grid_type:
          type: string
          enum:
          - square
          - none
        width_cells:
          type: integer
        height_cells:
          type: integer
        cell_px:
          type: number
        grid_offset_x:
          type: number
        grid_offset_y:
          type: number
        grid_distance:
          type: number
        grid_units:
          type: string
        settings:
          $ref: '#/components/schemas/VttSceneSettings'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VttSceneList:
      type: object
      required:
      - entities
      - active_scene_id
      properties:
        active_scene_id:
          type: string
          format: uuid
          nullable: true
        entities:
          type: array
          items:
            $ref: '#/components/schemas/VttScene'
    VttSceneChoice:
      type: object
      required:
      - scene_id
      additionalProperties: false
      properties:
        scene_id:
          type: string
          format: uuid
          nullable: true
    VttToken:
      type: object
      description: A token as the caller may see it. For players, name and disposition are what the DM chose to
        show (player_name, player_disposition), the true ones are never sent, and a token with a hidden name has
        no image. DMs also get player_name and player_disposition.
      required:
      - id
      - scene_id
      - kind
      - name
      - disposition
      - x
      - y
      - size_cells
      - layer
      - can_move
      properties:
        id:
          type: string
          format: uuid
        scene_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - character
          - marker
        character_id:
          type: string
          format: uuid
          nullable: true
        controller_character_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          description: What to label it with; may be empty (show the number only).
        number:
          type: integer
          nullable: true
          description: Shown as "#3"; unique in the scene.
        disposition:
          type: string
          enum:
          - party
          - friendly
          - neutral
          - hostile
        image_url:
          type: string
          nullable: true
        x:
          type: number
          description: Top-left corner
          in cells; whole numbers when snapped.: null
        y:
          type: number
        size_cells:
          type: number
          description: 0.5 Tiny
          1 Small or Medium: null
          2 Large: null
          3 Huge: null
          4 Gargantuan.: null
        layer:
          type: string
          enum:
          - tokens
          - dm
        can_move:
          type: boolean
          description: Whether the caller may move it (the server decides).
        player_name:
          type: string
          nullable: true
          description: DMs only.
        player_disposition:
          type: string
          nullable: true
          description: DMs only.
    VttMemberScene:
      type: object
      required:
      - user_id
      - scene_id
      properties:
        user_id:
          type: string
          format: uuid
        scene_id:
          type: string
          format: uuid
    VttState:
      type: object
      required:
      - role
      - seq
      - tokens
      properties:
        role:
          type: string
          enum:
          - dm
          - player
        seq:
          type: integer
          format: int64
          description: Stream from here (`?after=`).
        active_scene_id:
          type: string
          format: uuid
          nullable: true
          description: DMs only.
        scene:
          nullable: true
          description: Null when there's nothing to show yet (no active scene).
          allOf:
          - $ref: '#/components/schemas/VttScene'
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/VttToken'
        members:
          type: array
          description: DMs only. The players moved off the active scene, and where to.
          items:
            $ref: '#/components/schemas/VttMemberScene'
    VttCommand:
      type: object
      required:
      - type
      - scene_id
      additionalProperties: false
      description: 'One of: token.move (token_id, x, y); token.add (kind, x, y, and character_id for a character
        or name for a marker; the rest optional); token.update (token_id and the fields to change; null clears an
        optional one); token.remove (token_id); ping (x, y).'
      properties:
        type:
          type: string
          enum:
          - token.move
          - token.add
          - token.update
          - token.remove
          - ping
        command_id:
          type: string
          format: uuid
          description: Your id for it
          so a retry isn't applied twice.: null
        scene_id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - character
          - marker
        character_id:
          type: string
          format: uuid
        controller_character_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          nullable: true
          maxLength: 200
        player_name:
          type: string
          nullable: true
          maxLength: 200
        number:
          type: integer
          nullable: true
          minimum: 1
        disposition:
          type: string
          enum:
          - party
          - friendly
          - neutral
          - hostile
        player_disposition:
          type: string
          nullable: true
          enum:
          - party
          - friendly
          - neutral
          - hostile
        image_url:
          type: string
          nullable: true
          maxLength: 2048
        x:
          type: number
        y:
          type: number
        size_cells:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 50
        layer:
          type: string
          enum:
          - tokens
          - dm
    VttCommandResult:
      type: object
      required:
      - seq
      properties:
        seq:
          type: integer
          format: int64
          nullable: true
          description: Null for a ping.
        token:
          $ref: '#/components/schemas/VttToken'
    VttEvent:
      type: object
      description: 'The data of each stream event. Types: scene.created, scene.updated, scene.trashed, scene.activated,
        member.moved, member.updated, member.left, token.added, token.updated, token.moved, token.removed, campaign.deleted;
        ping (no seq).'
      required:
      - type
      - payload
      properties:
        seq:
          type: integer
          format: int64
        type:
          type: string
        scene_id:
          type: string
          format: uuid
          nullable: true
        actor_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        payload:
          type: object
    DndUser:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          nullable: true
        profile_picture_url:
          type: string
          nullable: true
    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          nullable: true
        profile_picture_url:
          type: string
          nullable: true
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    Fields:
      name: fields
      in: query
      description: Comma-separated fields to return (id is always included). Leave it off for every field.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size; 0 returns every match.
      schema:
        type: integer
        default: 100
        minimum: 0
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    Name:
      name: name
      in: query
      description: Name(s) to filter on (separated by commas ","), case-insensitive substring.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      description: AG Grid filter model as JSON, e.g. {"level":{"filterType":"number","type":"lessThanOrEqual","filter":3}}
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: AG Grid sort model as JSON, e.g. [{"colId":"level","sort":"asc"}]
      schema:
        type: string
    EntityId:
      name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: invite_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 100
    IfMatch:
      name: If-Match
      in: header
      description: The character's version; the write is a 409 if it has changed since.
      schema:
        type: string
    OpId:
      name: Op-Id
      in: header
      description: A uuid for this operation; an operation already applied (an offline replay) isn't applied again.
      schema:
        type: string
        format: uuid
    ChoiceId:
      name: choice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpellId:
      name: spell_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModifierId:
      name: modifier_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CharacterId:
      name: character_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefId:
      name: ref_id
      in: path
      required: true
      description: The catalog entry's id (the issue's id).
      schema:
        type: string
        format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
