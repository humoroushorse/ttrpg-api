        marked `approved` (on the sheet as an `info` issue), and the change goes in the character's change log.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: The character with what breaks the campaign's rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCharacter'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Campaigns
      operationId: revokeCampaignException
      summary: Take back an approved exception
      responses:
        '200':
          description: The character with what breaks the campaign's rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCharacter'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/sheet/preview:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    post:
      tags:
      - Characters
      operationId: previewCharacterSheet
      summary: The sheet after some changes, without saving them
      description: Each operation runs exactly as its route would (the same checks), in one transaction that is
        then rolled back. A failing operation is answered with its error, `detail` prefixed with its index. Ability
        and HP rolls aren't operations (they're random).
      parameters:
      - name: level
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - operations
              additionalProperties: false
              properties:
                operations:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/SheetOperation'
      responses:
        '200':
          description: The sheet as it would be
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterSheet'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/options/{kind}:
    parameters:
    - $ref: '#/components/parameters/EntityId'
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - species
        - background
        - class
        - subclass
        - feat
        - spell
    get:
      tags:
      - Characters
      operationId: readCharacterOptions
      summary: What can be picked, with the rules applied
      description: Catalog entries for a pick. With `slot` (from the sheet's choice_points) the point's own filter
        applies (Origin feats, Wizard cantrips, the class's subclasses); without it, `spell` lists the class's level
        1+ spells to prepare, `learned` marking the spellbook's under the spellbook rule (a 422 for a class that
        learns its spells at each level). Every entry says whether it's `allowed` and why not (the content rules,
        a feat's prerequisites, a slot above the highest). `filters=off` lists rule-breaking entries as allowed,
        with the reasons as warnings; only for a character with its own rules (a campaign's rules are limits).
      parameters:
      - name: slot
        in: query
        schema:
          type: string
      - name: level
        in: query
        description: The level to check against (default current_level).
        schema:
          type: integer
          minimum: 1
          maximum: 20
      - name: name
        in: query
        description: Only entries whose name contains this (any case).
        schema:
          type: string
      - name: filters
        in: query
        schema:
          type: string
          enum:
          - 'on'
          - 'off'
      - name: allowed
        in: query
        description: Only allowed entries, plus the ones the character already has.
        schema:
          type: boolean
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The entries, each with allowed and its reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterOptions'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/characters/{entity_id}/sheet:
