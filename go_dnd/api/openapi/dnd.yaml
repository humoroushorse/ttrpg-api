openapi: 3.0.3
info:
  title: DnD API
  description: D&D spells, sources, and user profiles.
  version: 1.0.0

servers:
  - url: http://localhost:8004
    description: Local development

tags:
  - name: Spells
  - name: Sources
  - name: Users
  - name: Health

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        trace_id:
          type: string

    SpellSchool:
      type: string
      enum:
        - abjuration
        - alteration
        - conjuration
        - divination
        - enchantment
        - evocation
        - transmutation
        - illusion
        - invocation
        - necromancy

    Spell:
      type: object
      required: [id, source_id, name, dnd_version, dnd_version_year, level, school, casting_time, range, duration, description]
      properties:
        id:
          type: string
        source_id:
          type: string
        name:
          type: string
        slug:
          type: string
          nullable: true
        dnd_version:
          type: string
        dnd_version_year:
          type: integer
        source_page:
          type: integer
          nullable: true
        level:
          type: integer
          minimum: 0
          maximum: 9
        school:
          $ref: '#/components/schemas/SpellSchool'
        is_ritual:
          type: boolean
        is_unearthed_arcana:
          type: boolean
        casting_time:
          type: string
        range:
          type: string
        has_verbal_component:
          type: boolean
        has_somatic_component:
          type: boolean
        has_material_component:
          type: boolean
        materials:
          type: string
          nullable: true
        has_spell_cost:
          type: boolean
        are_materials_consumed:
          type: boolean
        duration:
          type: string
        is_concentration:
          type: boolean
        description:
          type: string
        has_saving_throw:
          type: boolean
        difficulty_class_saving_throw_override:
          type: integer
          nullable: true
        damage_type:
          type: string
          nullable: true
        at_higher_levels:
          type: string
          nullable: true
        difficulty_class_saving_throw:
          type: string
          nullable: true
        difficulty_class_type:
          type: string
          nullable: true
        stat_blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid

    CreateSpellRequest:
      type: object
      required: [source_id, name, dnd_version, dnd_version_year, level, school, casting_time, range, duration, description]
      properties:
        id:
          type: string
        source_id:
          type: string
        name:
          type: string
        slug:
          type: string
          nullable: true
        dnd_version:
          type: string
        dnd_version_year:
          type: integer
        source_page:
          type: integer
          nullable: true
        level:
          type: integer
          minimum: 0
          maximum: 9
        school:
          $ref: '#/components/schemas/SpellSchool'
        is_ritual:
          type: boolean
          default: false
        is_unearthed_arcana:
          type: boolean
          default: false
        casting_time:
          type: string
        range:
          type: string
        has_verbal_component:
          type: boolean
          default: false
        has_somatic_component:
          type: boolean
          default: false
        has_material_component:
          type: boolean
          default: false
        materials:
          type: string
          nullable: true
        has_spell_cost:
          type: boolean
          default: false
        are_materials_consumed:
          type: boolean
          default: false
        duration:
          type: string
        is_concentration:
          type: boolean
          default: false
        description:
          type: string
        has_saving_throw:
          type: boolean
          default: false
        difficulty_class_saving_throw_override:
          type: integer
          nullable: true
        damage_type:
          type: string
          nullable: true
        at_higher_levels:
          type: string
          nullable: true
        difficulty_class_saving_throw:
          type: string
          nullable: true
        difficulty_class_type:
          type: string
          nullable: true
        stat_blocks:
          type: array
          items:
            type: object
            additionalProperties: true

    Source:
      type: object
      required: [id, name, name_short, dnd_version, dnd_version_year]
      properties:
        id:
          type: string
        name:
          type: string
        name_short:
          type: string
        publish_year:
          type: integer
          nullable: true
        dnd_version:
          type: string
        dnd_version_year:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid

    DndUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          nullable: true
        profile_picture_url:
          type: string
          nullable: true

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          nullable: true
        profile_picture_url:
          type: string
          nullable: true

    BulkLoadResponse:
      type: object
      properties:
        created:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string

    GenericListResponse:
      type: object
      properties:
        total_entities_count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        filters:
          type: object
          additionalProperties: true
        entities_count:
          type: integer
        entities:
          type: array
          items: {}

security:
  - BearerAuth: []

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Service is alive

  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

  /api/v1/spells:
    get:
      tags: [Spells]
      operationId: listSpells
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of spells
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Spell'
                  entities_count:
                    type: integer
                  total:
                    type: integer
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/spells/query:
    get:
      tags: [Spells]
      operationId: querySpells
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: integer
        - name: school
          in: query
          schema:
            $ref: '#/components/schemas/SpellSchool'
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Matching spells
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Spell'
                  entities_count:
                    type: integer
                  total:
                    type: integer

  /api/v1/spells/create:
    post:
      tags: [Spells]
      operationId: createSpell
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpellRequest'
      responses:
        '201':
          description: Spell created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spell'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/spells/bulk:
    post:
      tags: [Spells]
      operationId: bulkLoadSpells
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Bulk load result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkLoadResponse'
        '400':
          description: Parse error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sources/query:
    get:
      tags: [Sources]
      operationId: querySources
      parameters:
        - name: dnd_version
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
                  entities_count:
                    type: integer
                  total:
                    type: integer

  /api/v1/sources/bulk:
    post:
      tags: [Sources]
      operationId: bulkLoadSources
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Bulk load result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkLoadResponse'
        '400':
          description: Parse error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DndUser'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Users]
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DndUser'
        '403':
          description: Forbidden - can only update own profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
