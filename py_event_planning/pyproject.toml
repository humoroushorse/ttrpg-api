[project]
name = "py-event-planning"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
# `<4.0` is required: python-keycloak declares `<4`, and Poetry won't lock a wider range
requires-python = ">=3.15,<4.0"
# Minimum versions only: poetry.lock pins exact versions, and `poetry update <pkg>`
# is free to move to new major versions.
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.146.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
    "pandas>=3.0.6",
    "aiohttp>=3.14.5",
    "python-keycloak>=7.1.1",
]

[tool.poetry.group.dev.dependencies]
bandit = ">=1.9.4"
coverage = ">=7.16.2"
mkdocs = ">=1.6.1"
mkdocs-material = ">=9.7.7"
mkdocstrings = { extras = ["python"], version = ">=1.0.7" }
pylint = ">=4.1.3"
pytest = ">=9.1.1"
pytest-cov = ">=7.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
