[project]
name = "py-dnd"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
# `<4.0` is required: python-keycloak declares `<4`, and Poetry won't lock a wider range
requires-python = ">=3.15,<4.0"
# Minimum versions only: poetry.lock pins exact versions, and `poetry update <pkg>`
# is free to move to new major versions.
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.146.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
    "pandas>=3.0.6",
    "aiohttp>=3.14.5",
    "python-keycloak>=7.1.1",
]

[tool.poetry.group.dev.dependencies]
bandit = ">=1.9.4"
coverage = ">=7.16.2"
datamodel-code-generator = { extras = ["ruff"], version = ">=0.89.0" }
mkdocs = ">=1.6.1"
mkdocs-material = ">=9.7.7"
mkdocstrings = { extras = ["python"], version = ">=1.0.7" }
pylint = ">=4.1.3"
pytest = ">=9.1.1"
pytest-cov = ">=7.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# VTT spell models, generated from the ETL's JSON Schema (copied to ttrpg-api/schemas/).
# `make vtt-models` regenerates them; `make vtt-models-check` fails on drift.
[tool.datamodel-codegen.profiles.vtt_spell]
input = "../schemas/vtt_spell.v1.schema.json"
input-file-type = "jsonschema"
output = "py_dnd/features/spells/vtt_models.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.15"
use-annotated = true
field-constraints = true
extra-fields = "forbid"          # unknown keys are errors, same as the ETL models
strict-nullable = true           # a field with a default is not nullable unless the schema says so
enum-field-as-literal = "all"
use-schema-description = true    # model docstrings, which also become OpenAPI descriptions
formatters = ["ruff-check", "ruff-format"]
custom-file-header = """
# GENERATED by `make vtt-models` from ttrpg-api/schemas/vtt_spell.v1.schema.json. Don't edit.
# To change a field, edit the ETL's VTT models (ttrpg-data-dnd/playwright-data/transformer/
# playwright_data_transformer/vtt/), run `make vtt_schema` there, then `make vtt-models` here.
# Nested-model defaults are dicts that Pydantic validates (validate_default), hence the mypy line.
# ruff: noqa: D205, E501
# mypy: disable-error-code="assignment"
# pylint: skip-file"""
