apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: sprint-management
  labels:
    app: nats
data:
  nats.conf: |
    # NATS Server Configuration
    # Production configuration
    
    server_name: $POD_NAME
    port: 4222
    http_port: 8222
    
    # JetStream configuration
    jetstream {
      store_dir: "/data"
      max_memory_store: 1GB
      max_file_store: 10GB
    }
    
    # Logging
    debug: false
    trace: false
    logtime: true
    log_file: "/dev/stdout"
    
    # Limits
    max_connections: 1000
    max_control_line: 4096
    max_payload: 1048576  # 1MB
    max_pending: 67108864 # 64MB
    
    # Timeouts
    ping_interval: 120s
    ping_max: 3
    write_deadline: 10s
    
    # Monitoring
    http: "0.0.0.0:8222"
    
    # Authorization
    # Credentials should be stored in Kubernetes secrets
    # and mounted as environment variables
    authorization {
      users = [
        {
          user: $NATS_USER_SPRINT
          password: $NATS_PASSWORD_SPRINT
          permissions: {
            publish: ["sprint.>"]
            subscribe: ["sprint.>", "auth.*.validate.response"]
          }
        },
        {
          user: $NATS_USER_AUTH
          password: $NATS_PASSWORD_AUTH
          permissions: {
            publish: ["auth.>"]
            subscribe: ["auth.>", "sprint.*.*.validate.request"]
          }
        }
      ]
    }
