apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: sprint-management
  labels:
    app: nats
    component: messaging
spec:
  type: ClusterIP
  ports:
  - port: 4222
    targetPort: 4222
    protocol: TCP
    name: client
  - port: 8222
    targetPort: 8222
    protocol: TCP
    name: monitoring
  - port: 6222
    targetPort: 6222
    protocol: TCP
    name: cluster
  selector:
    app: nats
---
apiVersion: v1
kind: Service
metadata:
  name: nats-monitoring
  namespace: sprint-management
  labels:
    app: nats
    component: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 8222
    targetPort: 8222
    protocol: TCP
    name: http
  selector:
    app: nats
