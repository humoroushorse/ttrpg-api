# NATS Server Configuration
# For local development and testing

# Server settings
server_name: "nats-dev"
port: 4222
http_port: 8222

# JetStream configuration
jetstream {
  store_dir: "/data"
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Logging
debug: false
trace: false
logtime: true
log_file: "/dev/stdout"

# Limits
max_connections: 1000
max_control_line: 4096
max_payload: 1048576  # 1MB
max_pending: 67108864 # 64MB

# Timeouts
ping_interval: 120s
ping_max: 3
write_deadline: 10s

# Monitoring
http: "0.0.0.0:8222"

