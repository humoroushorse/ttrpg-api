default_language_version:
  python: python3.15

default_stages: [pre-commit, pre-push]

# fail_fast: true

repos:
  # BUILT INS
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: "test_data/json/seeds"
        args: ['--maxkb=500']
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents] # k8s manifests use `---`
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: pretty-format-json
        args: ['--autofix', '--indent=2', '--no-sort-keys']
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: no-commit-to-branch
        args: [--branch, staging]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # keep Markdown hard line breaks

  # RUFF
  #   Replaces black, isort, autoflake, flake8 (+ plugins), pyupgrade, pygrep-hooks,
  #   and best-doctor's no-asserts / old-style-annotations. Settings: pyproject.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # PYLINT (settings: .pylintrc)
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        exclude: migrations/versions/ # generated by alembic

  # MYPY (settings: pyproject.toml)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # migrations/: alembic env + generated versions (also clash as duplicate module names)
        # merge-openapi.py: same script name in go_dnd and go_sprint
        exclude: tests/|alembic/|scripts/|migrations/|merge-openapi\.py$

  # CUSTOM HOOKS
  - repo: local
    hooks:
    - id: validate-branch-name
      name: validate-branch-name
      entry: scripts/hooks/validate-branch-name.sh
      language: system
      pass_filenames: false
    # Schema copy vs the ETL's file, and generated models vs the copy (py_dnd/README.md)
    - id: vtt-models-check
      name: vtt-models-check
      entry: make -C py_dnd vtt-models-check
      language: system
      pass_filenames: false
      files: ^(schemas/vtt_spell\..+\.schema\.json|py_dnd/py_dnd/features/spells/vtt_models\.py|py_dnd/pyproject\.toml)$
