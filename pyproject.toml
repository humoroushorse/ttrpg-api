# Shared lint / format / type-check settings for every Python project in ttrpg-api.
# Used by .pre-commit-config.yaml. Pylint settings live in .pylintrc.

################################################################################
# Ruff: replaces black, isort, autoflake, flake8 (+ plugins), pyupgrade,
# pygrep-hooks, and best-doctor's no-asserts / old-style-annotations hooks
################################################################################
[tool.ruff]
line-length = 119
target-version = "py315"
# Folders containing each project's top-level packages (first-party for import sorting)
src = ["py_dnd", "py_event_planning", "pydnd/app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (flake8)
    "W",    # pycodestyle warnings (flake8)
    "F",    # pyflakes (flake8, autoflake)
    "I",    # import sorting (isort)
    "UP",   # pyupgrade, old-style annotations
    "C4",   # flake8-comprehensions
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "D",    # pydocstyle (flake8-docstrings)
    "PGH",  # pygrep-hooks (blanket noqa / type: ignore, mock methods)
    "S101", # no asserts outside tests (best-doctor no-asserts)
]
ignore = [
    # Same docstring exemptions the flake8 config had
    "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D401",
    "F541", # f-string without placeholders
    # Opt-in modernizations, now adopted (uncomment to opt back out). Their fixes can change behavior:
    # "UP042", # (str, Enum) -> StrEnum: changes str()/f-string output of members (code uses .value)
    # "UP046", # Generic[T] classes -> PEP 695 `class Foo[T]:` syntax (Pydantic reads these at runtime)
    # "UP047", # TypeVar functions -> PEP 695 `def foo[T]():` syntax
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"**/tests/**" = ["D", "S101", "T20"]
"**/merge-openapi.py" = ["T201"] # CLI scripts that report via print

[tool.ruff.lint.pycodestyle]
max-line-length = 120 # E501 limit flake8 used; the formatter still wraps at 119

[tool.ruff.lint.pydocstyle]
convention = "pep257" # flake8-docstrings default

################################################################################
# mypy (moved from setup.cfg)
################################################################################
[tool.mypy]
python_version = "3.15"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
